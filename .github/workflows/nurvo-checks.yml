name: NURVO - CI and visual checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: nurvo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    name: Static integrity and git commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify git working tree and commit
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)"
          git log -1 --format='Verified commit: %H%nSubject: %s'
          git diff --check HEAD^ HEAD
      - name: Verify static site scripts
        run: node tests/smoke.mjs
  browser:
    name: Real Chromium UI test
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify supported Playwright runner
        shell: bash
        run: |
          . /etc/os-release
          echo "Runner: $PRETTY_NAME"
          test "$VERSION_ID" = '24.04'
      - name: Install Playwright test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile journeys
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nurvo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nurvo-desktop-mobile-previews
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
  backend:
    name: Python API tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Verify API contract and cache behavior
        working-directory: backend
        run: python -m pytest -q tests
